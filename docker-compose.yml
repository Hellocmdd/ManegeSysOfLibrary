# 本地开发用 MySQL 8.4 容器。
# 复制 .env.example 为 .env 后填写 MYSQL_ROOT_PASSWORD / DB_PASSWORD，再执行 docker compose up -d。
# 首次启动会在空数据卷上按文件名顺序执行 04_init.sql → 05_存储过程.sql → 06_测试数据.sql。

services:
  mysql:
    image: mysql:8.4
    container_name: library-mysql
    ports:
      # 默认映射到宿主机 3307，避免与本机 MySQL 冲突；与 .env 的 DB_PORT 保持一致。
      - "${DB_PORT:-3307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: storageoflibrarysys
      MYSQL_USER: library
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    volumes:
      - library-mysql-data:/var/lib/mysql
      - ./src/backend/sql/04_init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./src/backend/sql/05_存储过程.sql:/docker-entrypoint-initdb.d/02_procedures.sql:ro
      - ./src/backend/sql/06_测试数据.sql:/docker-entrypoint-initdb.d/03_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  library-mysql-data:
