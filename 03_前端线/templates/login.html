{% extends "base.html" %}
{% block title %}登录 · 图书管理系统{% endblock %}

{% block content %}
<section class="card login-card">
  <h1>管理员登录</h1>
  <p class="hint">账号与密码由后端线的测试数据提供，密码在库中以 SHA256 存储。</p>

  <form method="post" action="{{ url_for('login') }}" class="form">
    <label for="account">账号</label>
    <input id="account" name="account" type="text" value="{{ account }}"
           autocomplete="username" required autofocus>

    <label for="password">密码</label>
    <input id="password" name="password" type="password"
           autocomplete="current-password" required>

    <button type="submit" class="btn btn-primary">登录</button>
  </form>

  <p class="hint">课程演示环境，请勿使用真实密码。</p>
</section>
{% endblock %}
