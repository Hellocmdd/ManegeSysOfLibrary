name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  guard:
    name: Secret guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard against committed .env
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env must not be committed"
            exit 1
          fi

  java-build:
    name: Java build and test (${{ matrix.os }})
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compile
        run: mvn -B -q -DskipTests compile

      - name: Test
        run: mvn -B test

  frontend-test:
    name: Frontend tests (${{ matrix.os }})
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: src/frontend/requirements.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r src/frontend/requirements.txt -r src/frontend/requirements-dev.txt

      - name: Validate shell launchers
        if: runner.os != 'Windows'
        run: bash -n start.sh src/frontend/start.sh src/backend/start.sh

      - name: Validate Windows launchers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $files = @('start.bat', 'src/frontend/start.bat', 'src/backend/start.bat')
          foreach ($file in $files) {
            if (-not (Test-Path $file)) { throw "Missing launcher: $file" }
            $bytes = [System.IO.File]::ReadAllBytes($file)
            if ($bytes | Where-Object { $_ -gt 127 }) { throw "$file must be ASCII-only" }
          }

      - name: Pytest
        run: python -m pytest -q -m "not integration"

  integration-contract:
    name: Frontend-backend contract (${{ matrix.os }})
    needs: [java-build, frontend-test]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: src/frontend/requirements.txt

      - name: Compile Java backend
        run: mvn -B -q -DskipTests compile

      - name: Install frontend test dependencies
        run: python -m pip install --disable-pip-version-check -r src/frontend/requirements.txt -r src/frontend/requirements-dev.txt

      - name: Contract tests
        run: python -m pytest -q src/frontend/tests/test_contract.py -m "not integration"

      # Live DB smoke is covered by integration-db below with an ephemeral Docker MySQL.

  integration-db:
    name: Live DB integration (Docker MySQL 8.4)
    needs: [java-build, frontend-test, integration-contract]
    runs-on: ubuntu-latest
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '3307'
      DB_NAME: storageoflibrarysys
      DB_USER: library
      # Ephemeral CI-only values for the container, not real credentials.
      DB_PASSWORD: ci-only-library-pwd
      MYSQL_ROOT_PASSWORD: ci-only-root-pwd
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: src/frontend/requirements.txt

      - name: Install frontend dependencies
        run: python -m pip install --disable-pip-version-check -r src/frontend/requirements.txt -r src/frontend/requirements-dev.txt

      - name: Validate compose file
        run: docker compose config -q

      - name: Start MySQL container
        run: docker compose up -d --wait

      - name: Java live integration tests
        env:
          RUN_DB_INTEGRATION: '1'
        run: mvn -B test

      - name: Frontend live smoke test
        env:
          RUN_DB_INTEGRATION: '1'
        run: python -m pytest -q -m integration

      - name: Stop MySQL container
        if: always()
        run: docker compose down -v
