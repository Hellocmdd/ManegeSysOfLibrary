name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  guard:
    name: Secret guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard against committed .env
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env must not be committed"
            exit 1
          fi

  java-build:
    name: Java build and test
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compile
        run: mvn -B -q -DskipTests compile

      - name: Test
        run: mvn -B test

  frontend-test:
    name: Frontend tests
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: src/frontend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check -r src/frontend/requirements.txt -r src/frontend/requirements-dev.txt

      - name: Pytest
        run: python -m pytest -q -m "not integration"

  integration-contract:
    name: Frontend-backend contract
    needs: [java-build, frontend-test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: src/frontend/requirements.txt

      - name: Compile Java backend
        run: mvn -B -q -DskipTests compile

      - name: Install frontend test dependencies
        run: |
          python -m pip install --disable-pip-version-check -r src/frontend/requirements.txt -r src/frontend/requirements-dev.txt

      - name: Contract tests
        run: python -m pytest -q src/frontend/tests/test_contract.py -m "not integration"

      # Live DB smoke test is intentionally skipped in CI: remote credentials
      # are not stored in the repository. Run locally with RUN_DB_INTEGRATION=1.
